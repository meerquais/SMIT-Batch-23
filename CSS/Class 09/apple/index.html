<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <nav class="navbar">

        <div class="logo">
            <img src="./assets/logo.svg" alt="">

        <div class="nav-links">
            <ul>
                <li>Store</li>
                <li>Mac</li>
                <li>iPad</li>
                <li>iPhone</li>
                <li>Watch</li>
                <li>Vision</li>

                <li>Entertainment</li>

    <section class="hero3">

        <div class="hero3section1">

            <div class="ipad"><img src="./assets/ipadair.png" alt=""></div>

            </div>

                <button class="hero3btn1">Learn more</button>
