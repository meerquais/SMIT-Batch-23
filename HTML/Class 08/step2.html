<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2:Personal Details</title>
</head>

<body>
    <h1>Person Details</h1>

    <fieldset>
        <legend>Step 2: Personal Details</legend>


        <form action="./step3.html">

            <label for="num">Number:</label>
            <input type="number" name="num" id="num" required min="9999999999"> <br><br>

            <label for="dob">Date of birth</label>
            <input type="date" name="dob" id="dob" required> <br><br>

            <label>Gender: </label>

            <input type="radio" name="gender" value="male" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" value="female" id="female">
            <label for="female">Female</label> <br><br>

            <label>Hobbies</label>

            <input type="checkbox" name="hobbies" value="reading" id="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" name="hobbies" value="football" id="football">
            <label for="football">Football</label>
            <input type="checkbox" name="hobbies" value="gaming" id="gaming">
            <label for="gaming">Gaming</label>
            <input type="checkbox" name="hobbies" value="programming" id="programming">
            <label for="programming">Programming</label> <br><br>

            <button> <a href="./index.html">Back</a> </button>
            <button type="submit">Next</button>



        </form>


    </fieldset>


</body>

</html>
