<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3:Your Review</title>
</head>

<body>
    <h1>Step 3 : Your Review</h1>

    <fieldset>
        <legend>Step 3 : Your Review</legend>

        <form action="./submit.html">

            <label>Country :</label>
            <select name="countries">
                <option disabled selected>Select Your Country</option>
                <option value="UAE">UAE</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Pakistan">Pakistan</option>
                <option value="Germany">Germany</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
                <option value="Norway">Norway</option>
                <option value="Argentina">Argentina</option>
                <option value="India">India</option>
            </select> <br> <br>

            <label>Where did you hear about us?</label>
            <select name="platform">
                <option value="Facebook">Facebook</option>
                <option value="Twitter">Twitter</option>
                <option value="Instagram">Instagram</option>
                <option value="Discord">Discord</option>
                <option value="Whatsapp">Whatsapp</option>
                <option value="Reddit">Reddit</option>
                <option value="LinkedIn">LinkedIN</option>
            </select> <br> <br>


            <label for="review">Feedback :</label> <br>
            <textarea name="review" id="review"></textarea> <br><br>

            <button><a href="./step2.html">Back</a></button>
            <button type="submit">Submit!</button>


        </form>






    </fieldset>




</body>

</html>
