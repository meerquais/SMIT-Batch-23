<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form!</title>
</head>

<body>
    <h1>Hello World!</h1>


    <fieldset>

        <legend>User Info!</legend>

        <form action="./step2.html">
            <label for="fullname">Full Name : </label>
            <input type="text" name="fullname" id="fullname" required placeholder="Type your name" minlength="3">
            <br /><br />

            <label for="email">Email : </label>
            <input type="email" name="email" id="email" required placeholder="Type your email"> <br /> <br />


            <label for="password">Password : </label>
            <input type="password" name="password" id="password" required placeholder="Type your password"> <br /><br />


            <label for="confirmPassword">Confirm Password : </label>
            <input type="password" name="confirmPassword" id="confirmPassword" required
                placeholder="Confirm Your Password"> <br /><br />


            <button type="submit">Next</button>


        </form>


    </fieldset>

</body>

</html>
